name: Daily Job Search

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run_all.py

      - name: Commit updated results
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/index.html seen_jobs.json matched_jobs.json raw_jobs.json
          git commit -m "Daily job refresh: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
